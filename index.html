<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>へのへのもへじ</title>

<meta name="theme-color" content="#0b1020">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#081221;
color:#fff;
overflow-x:hidden;
}

body::-webkit-scrollbar{
width:8px;
}

body::-webkit-scrollbar-thumb{
background:#00d9ff;
border-radius:20px;
}

#loading{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#081221;
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
transition:1s;

}

.loader{

width:90px;
height:90px;
border:8px solid rgba(255,255,255,.15);
border-top:8px solid #00e5ff;
border-radius:50%;
animation:spin 1s linear infinite;

}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}

header{

position:fixed;
top:0;
left:0;
width:100%;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:999;
backdrop-filter:blur(15px);
background:rgba(0,0,0,.25);

}

.logo{

font-size:26px;
font-weight:bold;
text-shadow:0 0 20px cyan;

}

.menu{

display:flex;
gap:18px;

}

.menu a{

color:white;
text-decoration:none;
font-weight:bold;

}

.hero{

height:100vh;

background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.55)),
url("hero.jpg") center center/cover no-repeat;

display:flex;
justify-content:center;
align-items:center;
text-align:center;

}

.hero-content{

max-width:700px;
padding:20px;

}

.hero h1{

font-size:68px;
margin-bottom:20px;
text-shadow:0 0 25px cyan;

}

.hero p{

font-size:24px;
opacity:.9;
margin-bottom:40px;

}

.button{

display:inline-block;
padding:18px 50px;
border-radius:60px;
background:#00d9ff;
color:#fff;
text-decoration:none;
font-weight:bold;
transition:.3s;
box-shadow:0 0 25px #00d9ff;

}

.button:hover{

transform:scale(1.08);

}

section{

padding:90px 20px;

}

.container{

max-width:1200px;
margin:auto;

}

.title{

font-size:42px;
text-align:center;
margin-bottom:50px;
text-shadow:0 0 18px cyan;

}

.card{

background:rgba(255,255,255,.08);

backdrop-filter:blur(10px);

border:1px solid rgba(255,255,255,.15);

border-radius:20px;

padding:30px;

margin-bottom:30px;

transition:.4s;

}

.card:hover{

transform:translateY(-8px);

}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:25px;

}

.gallery img{

width:100%;

border-radius:18px;

display:block;

}

footer{

padding:60px 20px;

text-align:center;

background:#060d18;

}

.top{

position:fixed;

right:20px;

bottom:20px;

width:55px;

height:55px;

border-radius:50%;

background:#00d9ff;

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

cursor:pointer;

box-shadow:0 0 20px cyan;

}

@media(max-width:768px){

.hero h1{

font-size:42px;

}

.hero p{

font-size:18px;

}

.menu{

display:none;

}

.title{

font-size:32px;

}

}

</style>

</head>

<body>

<div id="loading">

<div class="loader"></div>

</div>

<header>

<div class="logo">
へのへのもへじ
</div>

<nav class="menu">

<a href="#about">紹介</a>

<a href="#gallery">ギャラリー</a>

<a href="#youtube">YouTube</a>

<a href="#contact">お問い合わせ</a>

</nav>

</header>

<section class="hero">

<div class="hero-content">

<h1>へのへのもへじ</h1>

<p>

笑って楽しめるキャラクターサイト

</p>

<a class="button" href="#about">

スクロール

</a>

</div>

</section>
